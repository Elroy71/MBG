<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Supplier & Kebutuhan — My MBG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- PHOSPHOR ICONS -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary-navy: #1E3A8A;
    --primary-blue: #2563EB;
    --primary-light: #EFF6FF;
    --bg-main: #F8FAFC;
    --card-bg: #FFFFFF;
    --border-color: #E2E8F0;
    --text-main: #0F172A;
    --text-sec: #475569;
    --text-muted: #64748B;
    --success: #16A34A;
    --success-bg: #DCFCE7;
    --danger: #DC2626;
    --danger-bg: #FEE2E2;
    --warn: #D97706;
    --warn-bg: #FEF3C7;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
  }  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    padding-top: 76px;
    padding-bottom: 40px;
    line-height: 1.5;
    font-size: 16px;
  }

  /* TOP NAVBAR (FIXED ABOVE) */
  .top-navbar {
    background: linear-gradient(135deg, var(--primary-navy) 0%, #1D4ED8 100%);
    color: #FFFFFF;
    padding: 12px 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(30, 58, 138, 0.25);
    width: 100%;
    box-sizing: border-box;
  }
  .brand-title { display: flex; align-items: center; cursor: default; }
  .brand-logo { height: 52px; width: auto; max-width: 200px; object-fit: contain; }
  .header-icons { display: flex; gap: 8px; }
  .icon-btn {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .icon-btn:active { transform: none; }
  @media (max-width: 380px) {
    body { padding-top: 68px; }
    .icon-btn { width: 37px; height: 37px; font-size: 17px; }
    .brand-logo { height: 44px; }
  }
  .cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #F59E0B;
    color: #0F172A;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 12px;
    border: 2px solid var(--primary-navy);
    line-height: 1;
    min-width: 18px;
    text-align: center;
  }
  .fav-badge {
    background: #EC4899 !important;
    color: #FFFFFF !important;
  }
  .chat-badge {
    background: #EF4444 !important;
    color: #FFFFFF !important;
  }
  .notif-badge {
    background: #3B82F6 !important;
    color: #FFFFFF !important;
  }

  /* FAVORIT MODAL BACKDROP & BOX */
  .fav-modal-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(5px);
    z-index: 9999;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .fav-modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .fav-modal-box {
    background: #FFFFFF;
    width: 100%;
    max-width: 640px;
    border-radius: 24px 24px 0 0;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .fav-modal-backdrop.show .fav-modal-box { transform: translateY(0); }
  .fav-modal-header {
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .close-modal-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #F1F5F9;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text-sec);
    cursor: pointer;
  }
  .fav-modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .fav-item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: #FAFAFA;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fav-item-row:hover { border-color: var(--primary-blue); background: #FFFFFF; }
  .fav-item-img {
    width: 56px; height: 56px;
    border-radius: 10px;
    background: #F1F5F9;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .fav-item-img img { width: 100%; height: 100%; object-fit: cover; }
  .fav-item-info { flex: 1; min-width: 0; }
  .fav-item-name { font-size: 14px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-item-price { font-size: 15px; font-weight: 800; color: var(--primary-blue); margin-top: 2px; }
  .fav-order-btn {
    background: var(--primary-blue);
    color: #FFFFFF;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px; font-weight: 800;
    cursor: pointer;
  }
  .fav-remove-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #FEE2E2;
    color: #EF4444;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
  }

  /* MAIN CONTAINER */
  .main-container { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; width: 100%; box-sizing: border-box; overflow: hidden; }

  /* SEARCH & FILTER SUPPLIER */
  .section-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .section-title { font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
  .section-title i { font-size: 22px; color: var(--primary-blue); }

  .search-box {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 6px 16px;
    box-shadow: var(--shadow-sm);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    padding: 10px 8px;
  }
  .search-box i { font-size: 20px; color: var(--primary-blue); }

  .filter-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-strip::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 8px 14px;
    background: #FFFFFF;
    border: 1.5px solid var(--border-color);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-sec);
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .filter-chip.active {
    background: var(--primary-navy);
    color: #FFFFFF;
    border-color: var(--primary-navy);
    box-shadow: 0 3px 8px rgba(30, 58, 138, 0.2);
  }

  /* SUPPLIER GRID */
  .supplier-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .supplier-card {
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: all 0.2s;
  }
  .supplier-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary-blue); }
  .supplier-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--primary-light);
    color: var(--primary-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .supplier-body { flex: 1; min-width: 0; }
  .supplier-name { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .badge-verified {
    background: #DBEAFE;
    color: #1D4ED8;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .supplier-meta { font-size: 13px; color: var(--text-muted); font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px; }
  .supplier-meta-item { display: flex; align-items: center; gap: 4px; }
  .rating-gold { color: #F59E0B; }
  .supplier-action {
    color: var(--primary-blue);
    font-size: 20px;
    align-self: center;
  }

  /* MODAL STATUS PENGEMBANGAN */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #FFFFFF;
    border-radius: 24px;
    width: 100%;
    max-width: 360px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transform: translateY(20px) scale(0.95);
    transition: all 0.25s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0) scale(1); }
  .modal-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #FEF3C7;
    color: #D97706;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin: 0 auto 16px;
  }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
  .modal-desc { font-size: 14px; color: var(--text-sec); font-weight: 500; line-height: 1.5; margin-bottom: 22px; }
  .modal-btn {
    width: 100%;
    padding: 13px;
    background: var(--primary-navy);
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
  }
  .modal-btn:active { transform: none; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: #0F172A;
    color: #FFFFFF;
    padding: 14px 24px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 300;
    white-space: nowrap;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL STATUS PENGEMBANGAN -->
<div class="modal-overlay" id="devModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="ph-duotone ph-cone-diagonal"></i></div>
    <div class="modal-title" id="modalSupplierName">Supplier MBG</div>
    <div class="modal-desc">Masih dalam tahap pengembangan. Fitur kemitraan supplier & vendor langsung SPPG sedang dipersiapkan.</div>
    <button class="modal-btn" onclick="closeDevModal()">Mengerti & Tutup</button>
  </div>
</div>

<!-- TOP NAVBAR (FIXED ABOVE) -->
<div class="top-navbar">
  <div class="brand-title">
    <img src="asset/logombg.png" alt="My MBG" class="brand-logo" onerror="this.onerror=null;this.src='file:///d:/MBG_project/asset/logombg.png';">
  </div>
  <div class="header-icons">
    <button class="icon-btn" title="Hubungi Penjual / CS" onclick="window.location.href='/akun/?page=chat'">
      <i class="ph-bold ph-chat-teardrop-dots"></i>
      <span class="cart-badge chat-badge" id="chatBadgeDisplay" style="display:none;">{{unread_chat}}</span>
    </button>
    <button class="icon-btn" title="Produk Favorit" onclick="openFavModal()">
      <i class="ph-bold ph-heart"></i>
      <span class="cart-badge fav-badge" id="favBadgeDisplay" style="display:none;">0</span>
    </button>
    <button class="icon-btn" title="Notifikasi" onclick="window.location.href='/akun/?page=notifikasi'">
      <i class="ph-bold ph-bell"></i>
      <span class="cart-badge notif-badge" id="notifBadgeDisplay" style="display:none;">{{unread_notif}}</span>
    </button>
    <button class="icon-btn cart-btn" title="Keranjang Belanja" onclick="window.location.href='/cart/'">
      <i class="ph-bold ph-shopping-cart"></i>
      <span class="cart-badge" id="cartBadgeDisplay">{{total_cart}}</span>
    </button>
  </div>
</div>

<!-- FAVORIT MODAL -->
<div class="fav-modal-backdrop" id="favModalBackdrop" onclick="closeFavModal()">
  <div class="fav-modal-box" onclick="event.stopPropagation()">
    <div class="fav-modal-header">
      <div style="display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:var(--primary-navy);">
        <i class="ph-fill ph-heart" style="color:#EC4899;font-size:24px;"></i> Daftar Produk Favorit
      </div>
      <button class="close-modal-btn" onclick="closeFavModal()"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="fav-modal-body" id="favModalList">
      <div style="padding:40px;text-align:center;color:var(--text-muted);">Belum ada produk favorit tersimpan</div>
    </div>
  </div>
</div>

<div class="main-container">

  <!-- DAFTAR SUPPLIER & VENDOR UNGGULAN MBG (PENGGANTI KATEGORI EKSPLORASI) -->
  <div>
    <div class="section-header">
      <div class="section-title"><i class="ph-bold ph-shield-check"></i> Supplier & Vendor Terpercaya SPPG</div>
      
      <!-- SEARCH BAR SUPPLIER -->
      <div class="search-box">
        <i class="ph-bold ph-magnifying-glass"></i>
        <input type="text" id="searchSupplier" placeholder="Cari supplier atau lokasi gudang..." oninput="filterSupplier(this.value)">
      </div>

      <!-- FILTER CHIPS WILAYAH -->
      <div class="filter-strip">
        <button class="filter-chip active" onclick="setWilayah('Semua', this)"><i class="ph-bold ph-map-pin"></i> Semua Wilayah</button>
        <button class="filter-chip" onclick="setWilayah('Jakarta', this)"><i class="ph-bold ph-buildings"></i> Jakarta</button>
        <button class="filter-chip" onclick="setWilayah('Bandung', this)"><i class="ph-bold ph-tree"></i> Bandung</button>
        <button class="filter-chip" onclick="setWilayah('Jawa Barat', this)"><i class="ph-bold ph-map-trifold"></i> Jawa Barat</button>
        <button class="filter-chip" onclick="setWilayah('Jawa Tengah', this)"><i class="ph-bold ph-barn"></i> Jawa Tengah</button>
      </div>
    </div>

    <!-- SUPPLIER LIST -->
    <div class="supplier-grid" id="supplierGrid"></div>
  </div>

</div>

<script>
function rp(n) { return 'Rp ' + Math.round(n || 0).toLocaleString('id-ID'); }

function getFavs() {
  try {
    const f = JSON.parse(localStorage.getItem('mbg_favorites') || '[]');
    return Array.isArray(f) ? f.filter((v, i, a) => a.indexOf(v) === i) : [];
  } catch(e) { return []; }
}

function cleanStaleFavs() {
  const favs = getFavs();
  // Di halaman jelajah kita bersihkan duplikat
  if (favs.length) {
    const cleaned = favs.filter((id, index) => favs.indexOf(id) === index);
    if (cleaned.length !== favs.length) {
      localStorage.setItem('mbg_favorites', JSON.stringify(cleaned));
    }
  }
}

function syncFavBadge() {
  cleanStaleFavs();
  const badge = document.getElementById('favBadgeDisplay');
  if (!badge) return;
  const favs = getFavs();
  if (favs.length > 0) {
    badge.textContent = favs.length;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function openFavModal() {
  const backdrop = document.getElementById('favModalBackdrop');
  const listEl = document.getElementById('favModalList');
  if (!backdrop || !listEl) return;

  const favs = getFavs();
  if (!favs.length) {
    listEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);"><i class="ph-duotone ph-heart-break" style="font-size:56px;display:block;margin:0 auto 12px;color:#CBD5E1;"></i>Belum ada produk favorit tersimpan.<br><span style="font-size:13px;">Klik ikon hati (♡) pada produk di halaman Home untuk menyimpan.</span></div>';
  } else {
    listEl.innerHTML = favs.map(id => {
      return `
        <div class="fav-item-row" onclick="window.location.href='/cart/'">
          <div class="fav-item-img">
            <i class="ph-duotone ph-package" style="font-size:28px;color:#94A3B8;"></i>
          </div>
          <div class="fav-item-info">
            <div class="fav-item-name">Produk Favorit (#${id})</div>
            <div class="fav-item-price">Tersedia di Home</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="fav-order-btn" onclick="event.stopPropagation(); window.location.href='/cart/'">Lihat</button>
            <button class="fav-remove-btn" onclick="event.stopPropagation(); removeFavItem('${id}')" title="Hapus"><i class="ph-bold ph-trash"></i></button>
          </div>
        </div>
      `;
    }).join('');
  }

  backdrop.classList.add('show');
}

function closeFavModal() {
  const backdrop = document.getElementById('favModalBackdrop');
  if (backdrop) backdrop.classList.remove('show');
}

function removeFavItem(id) {
  let favs = getFavs();
  const idx = favs.indexOf(String(id));
  if (idx !== -1) {
    favs.splice(idx, 1);
    localStorage.setItem('mbg_favorites', JSON.stringify(favs));
    syncFavBadge();
    openFavModal();
  }
}

function syncCartBadge() {
  const badge = document.getElementById('cartBadgeDisplay');
  if (!badge) return;
  const val = badge.textContent.trim();
  const parsed = parseInt(val, 10);
  
  let cartItems = [];
  try {
    cartItems = JSON.parse(localStorage.getItem('mbg_cart_items') || '[]');
    if (!Array.isArray(cartItems)) cartItems = [];
  } catch(e) { cartItems = []; }

  if (!isNaN(parsed) && parsed > 0 && !val.includes('{{')) {
    badge.textContent = Math.max(parsed, cartItems.length);
  } else {
    badge.textContent = cartItems.length;
  }
}

function syncChatBadge() {
  const badge = document.getElementById('chatBadgeDisplay');
  if (!badge) return;
  const val = badge.textContent.trim();
  let count = 0;
  if (val && !val.includes('{{') && !isNaN(parseInt(val, 10))) {
    count = parseInt(val, 10);
  }
  const localCount = parseInt(localStorage.getItem('mbg_unread_chat') || '0', 10);
  if (localCount > count) count = localCount;
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function syncNotifBadge() {
  const badge = document.getElementById('notifBadgeDisplay');
  if (!badge) return;
  const val = badge.textContent.trim();
  let count = 0;
  if (val && !val.includes('{{') && !isNaN(parseInt(val, 10))) {
    count = parseInt(val, 10);
  }
  const localCount = parseInt(localStorage.getItem('mbg_unread_notif') || '0', 10);
  if (localCount > count) count = localCount;
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

(function() {
  syncCartBadge();
  syncFavBadge();
  syncChatBadge();
  syncNotifBadge();
})();

window.addEventListener('pageshow', () => {
  syncCartBadge();
  syncFavBadge();
  syncChatBadge();
  syncNotifBadge();
});

// DUMMY SUPPLIER TERPERCAYA DATA
const DUMMY_SUPPLIERS = [
  { id: 1, nama: 'PT Pangan Sejahtera Nasional', rating: '4.9', trx: '1.4k+ Transaksi', lokasi: 'Lembang, Bandung', wilayah: 'Bandung', icon: 'warehouse', badge: 'Terverifikasi SPPG' },
  { id: 2, nama: 'CV Tani Makmur Abadi', rating: '4.8', trx: '980+ Transaksi', lokasi: 'Cianjur, Jawa Barat', wilayah: 'Jawa Barat', icon: 'plant', badge: 'Terverifikasi SPPG' },
  { id: 3, nama: 'Koperasi Peternak Unggul Jabar', rating: '4.9', trx: '2.1k+ Transaksi', lokasi: 'Bogor, Jawa Barat', wilayah: 'Jawa Barat', icon: 'fish-simple', badge: 'Mitra Utama' },
  { id: 4, nama: 'PT Bulog Logistik SPPG', rating: '5.0', trx: '5.0k+ Transaksi', lokasi: 'Jakarta Pusat', wilayah: 'Jakarta', icon: 'shield-check', badge: 'BUMN Resmi' },
  { id: 5, nama: 'UD Bahari Nusantara Abadi', rating: '4.7', trx: '850+ Transaksi', lokasi: 'Muara Baru, Jakarta', wilayah: 'Jakarta', icon: 'fish', badge: 'Terverifikasi SPPG' },
  { id: 6, nama: 'CV Agro Segar Sentosa', rating: '4.8', trx: '1.1k+ Transaksi', lokasi: 'Brebes, Jawa Tengah', wilayah: 'Jawa Tengah', icon: 'carrot', badge: 'Mitra Unggulan' },
];

let activeWilayah = 'Semua';
let searchQuery = '';

function setWilayah(wilayah, el) {
  document.querySelectorAll('.filter-chip').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  activeWilayah = wilayah;
  renderSuppliers();
}

function filterSupplier(val) {
  searchQuery = val.trim().toLowerCase();
  renderSuppliers();
}

function renderSuppliers() {
  const container = document.getElementById('supplierGrid');
  let list = [...DUMMY_SUPPLIERS];

  if (activeWilayah !== 'Semua') {
    list = list.filter(s => s.wilayah === activeWilayah || s.lokasi.includes(activeWilayah));
  }
  if (searchQuery) {
    list = list.filter(s => s.nama.toLowerCase().includes(searchQuery) || s.lokasi.toLowerCase().includes(searchQuery));
  }

  if (!list.length) {
    container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size: 15px;"><i class="ph-duotone ph-building-office" style="font-size:44px;display:block;margin:0 auto 10px;"></i> Supplier untuk kriteria pencarian ini belum ditemukan</div>';
    return;
  }

  container.innerHTML = list.map(s => `
    <div class="supplier-card" onclick="openDevModal('${s.nama.replace(/'/g, "\\'")}')">
      <div class="supplier-icon"><i class="ph-bold ph-${s.icon || 'storefront'}"></i></div>
      <div class="supplier-body">
        <div class="supplier-name">
          ${s.nama}
          <span class="badge-verified"><i class="ph-bold ph-check-circle"></i> ${s.badge}</span>
        </div>
        <div class="supplier-meta">
          <div class="supplier-meta-item rating-gold"><i class="ph-fill ph-star"></i> <b>${s.rating}</b> (${s.trx})</div>
          <div class="supplier-meta-item"><i class="ph-bold ph-map-pin"></i> ${s.lokasi}</div>
        </div>
      </div>
      <div class="supplier-action"><i class="ph-bold ph-caret-right"></i></div>
    </div>
  `).join('');
}

function openDevModal(nama) {
  document.getElementById('modalSupplierName').textContent = nama;
  document.getElementById('devModal').classList.add('show');
}

function closeDevModal() {
  document.getElementById('devModal').classList.remove('show');
}

window.addEventListener('DOMContentLoaded', () => {
  renderSuppliers();
});
</script>
</body>
</html>
