<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Beli Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="background-utama">

  <div class="container-fluid">

    <!-- FIXED BOTTOM BAR -->
    <div class="fixed-bottom">
      <div class="container" style="width:100%;background:#dddddd;">
        <div class="d-flex pb-4 pt-4">
          <div class="d-flex flex-fill ms-4 flex-column">
            <span class="ukuran_teks_detail">Total Belanja</span>
            <span class="fw-bold" id="totalbayar"></span>
          </div>
          <a href="{{url_website_baru}}/start_transaksi" class="btn btn-primary me-4 align-self-center shadow" style="font-size:10pt;width:40%" id="tombol_bayar">Bayar</a>
        </div>
      </div>
    </div>

    <div id="pesan_alert"></div>
    <div id="area_voucher"></div>

    <!-- 1. KERANJANG TRANSAKSI -->
    <div id="keranjang_transaksi"></div>

    <!-- 2. PILIH PEMBAYARAN -->
    <div class="card mt-4">
      <div class="card-header">
        <span class="font-monospace"> <i class="bi bi-credit-card-2-front"></i> Pilih Pembayaran</span>
      </div>
      <a href="{{url_website_baru}}/ganti_metode_bayar" class="link-underline link-underline-opacity-0">
        <div class="card-body">
          <div class="card mt-1 mb-1">
            <div class="card-body bg-active">
              <div class="d-flex align-items-center">
                <div class="flex-grow-1 pe-4">
                  <img class="img-fluid" alt="" style="max-height:30px;object-fit: scale-down;object-position: left;" id="icon_metode_bayar">
                  <span class="card-title mb-0 ms-2" id="judul_metode_bayar"></span>
                </div>
                <i class="bi bi-chevron-compact-right align-self-center" style="font-size:18pt"></i>
              </div>
            </div>

            <div class="card-footer text-body-secondary bg-warning bg-opacity-25 d-none ukuran_teks_detail" id="bayar_keterangan_tambahan"></div>
          </div>
        </div>
      </a>
      
      <!-- GUNAKAN VOUCHER -->
      <div class="card-footer text-body-secondary bg-success text-dark bg-opacity-10">
        <div class="d-flex align-items-center ms-1">
          <i class="bi bi-postcard-heart me-2 fw-bold" style="color:#d08a0a;font-size:20pt"></i>
          <a href="{{url_website_baru}}/input_voucher" class="link-underline link-underline-opacity-0"><span class="ukuran_teks_detail text-body flex-grow-1 fw-semibold">Gunakan Voucher</span></a>
          <i class="bi bi-chevron-compact-right align-self-center" style="font-size:15pt"></i>
        </div>
      </div>
    </div>

    <!-- 3. ALAMAT PENGIRIMAN -->
    <div class="card mt-2" id="card_alamat">
      <div class="card-header">
        <span class="font-monospace"> <i class="bi bi-rocket-takeoff"></i> Alamat Pengiriman</span>
      </div>

      <div class="card-body">
        <div class="card mt-1 mb-2">
          <a href="{{url_website_baru}}/ganti_alamat" class="link-underline link-underline-opacity-0 text-body">
            <div class="card-body bg-active">
              <div class="d-flex">
                <span class="flex-grow-1">
                  <i class="bi bi-geo-alt"></i>
                  <span id="alamat_lengkap"></span><br>
                  <span style="font-size:10pt" id="lokasi_tujuan"></span>
                  <br>
                  <span style="font-size:8pt" class="fst-italic" id="nama_penerima"></span>
                </span>
                <i class="bi bi-chevron-compact-right align-self-center" style="font-size:18pt"></i>
              </div>
            </div>
          </a>
          <div class="card-footer text-body-secondary bg-success text-dark bg-opacity-10 d-none" id="informasi_data_dropship">
            <span class="fw-bold"> <i class="bi bi-people"></i> Data Dropship</span>
          </div>
        </div>

        <a href="{{url_website_baru}}/isi_dropship" class="text-decoration-none d-none" id="link-dropship"><span class="fw-light text-end text-dark-emphasis d-block mt-2" style="font-size:9pt">Kirim atas nama saya (dropship)</span></a>
      </div>
    </div>

    <!-- 4. RINGKASAN BELANJA -->
    <div class="card mt-2">
      <div class="card-header">
        <span class="font-monospace"> <i class="bi bi-bag-check"></i> Ringkasan Belanja</span>
      </div>
      <div class="card-body">
        <div class="d-flex flex-column pl-1" id="ringkasan_belanja"></div>
      </div>
    </div>

    <!-- 5. CHAT AJUKAN PERTANYAAN & ULASAN PRODUK -->
    <div class="card mt-2 mb-4">
      <div class="card-header">
        <span class="font-monospace"> <i class="bi bi-chat-dots"></i> Layanan & Ulasan Pembeli</span>
      </div>
      <div class="card-body p-2">
        <div class="row g-2">
          <!-- Tombol Chat Ajukan Pertanyaan -->
          <div class="col-6">
            <a href="https://wa.me/6281234567890?text=Halo%20Admin%2C%20saya%20ingin%20ajukan%20pertanyaan%20terkait%20pesanan%20di%20keranjang" target="_blank" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center py-2" style="font-size:9.5pt; border-radius: 10px;">
              <i class="bi bi-chat-dots-fill me-2" style="font-size:14pt;"></i>
              <span>Ajukan Pertanyaan</span>
            </a>
          </div>
          <!-- Tombol Ulasan Produk -->
          <div class="col-6">
            <a href="{{url_website_baru}}/ulasan" class="btn btn-outline-warning text-dark w-100 d-flex align-items-center justify-content-center py-2" style="font-size:9.5pt; border-radius: 10px; border-color: #d08a0a;">
              <i class="bi bi-star-fill me-2" style="color: #d08a0a; font-size:14pt;"></i>
              <span class="fw-semibold">Ulasan Produk</span>
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="height:120px"></div>

</body>

<style media="screen">
  :root{
    --bo-warna-utama:{{warna_utama}};
    --bo-warna-gelap:{{warna_gelap}};
    --bo-warna-terang:{{warna_terang}};
  }
  .background-utama {
    background: #e6e6e6;
  }
  .text-primary{
    color:var(--bo-warna-utama) !important;
  }
  .btn-primary {
    --bs-btn-bg: var(--bo-warna-utama);
    --bs-btn-border-color: var(--bo-warna-utama);
    --bs-btn-hover-bg: var(--bo-warna-gelap);
    --bs-btn-hover-border-color: var(--bo-warna-gelap);
    --bs-btn-active-bg:var(--bo-warna-terang);
    --bs-btn-active-border-color:var(--bo-warna-terang);
  }
  .btn-outline-primary {
    --bs-btn-border-color: var(--bo-warna-utama);
    --bs-btn-hover-bg: var(--bo-warna-terang);
    --bs-btn-hover-border-color: var(--bo-warna-gelap);
    --bs-btn-active-bg:var(--bo-warna-utama);
    --bs-btn-active-border-color:var(--bo-warna-utama);
    color: var(--bo-warna-utama);
  }
  .dot_horizontal_line{
    height: .75rem;
    border-top: 1px dashed #cacaca;
  }
  .ukuran_teks_detail{
    font-size:10pt;
  }
  .bg-active:active{
    background: var(--bo-warna-terang);
  }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script type="text/javascript">
var json_checkout = null;
try {
  const raw_checkout = `{{json_checkout}}`;
  if (raw_checkout && !raw_checkout.includes('{{')) {
    json_checkout = JSON.parse(raw_checkout);
  }
} catch(e) {
  try { json_checkout = eval('(' + `{{json_checkout}}` + ')'); } catch(err) {}
}

var harga_produk_map = {};
var qty_produk_map = {};
var base_total_ongkir = 0;
var base_potongan_voucher = 0;

$(document).ready(function(){
  if(json_checkout && typeof json_checkout === 'object' && json_checkout.status=="ok" && json_checkout.hasOwnProperty('list_data_transaksi') && json_checkout.list_data_transaksi.length>0){
    if("alamat_user" in json_checkout && json_checkout.alamat_user){
      setAlamatUser(json_checkout.alamat_user);
      if(json_checkout.list_data_transaksi.length==1 && json_checkout.list_data_transaksi[0].list_data_produk.length==1 && json_checkout.list_data_transaksi[0].data_ongkir && json_checkout.list_data_transaksi[0].data_ongkir.id_select_ongkir=="digital"){
        $('#card_alamat').hide();
      }
    } else {
      $('#card_alamat').hide();
    }

    if(json_checkout.is_pascabayar){
      $('#tombol_bayar').text("Cek Tagihan");
    }

    let nomor_keranjang = 1;
    $('#keranjang_transaksi').empty();
    json_checkout.list_data_transaksi.forEach((data_keranjang) => {
      setKeranjang(data_keranjang, nomor_keranjang);
      nomor_keranjang++;
    });

    setMetodeBayar();
    setDataDropship();
    showInfoVoucher();
    startPerhitungan();
  } else {
    renderDemoFallback();
  }
});

function setKeranjang(data_keranjang, nomor_keranjang){
  let html_keranjang = `
  <div class="card mt-2">
    <div class="card-header">
      <span class="font-monospace"><i class="bi bi-receipt"></i> PESANAN #${nomor_keranjang}</span>
    </div>
    <div class="card-body">
      <div class="row">`;

  if(!data_keranjang.data_ongkir){
    if(!json_checkout.alamat_user){
      window.location.href = "{{url_website_baru}}/ganti_alamat";
    }
    html_keranjang += `<div class="alert alert-warning" role="alert">Produk tidak bisa dipesan karena ongkos kirim tidak ditemukan</div>`;
    $('#tombol_bayar').hide();
  } else {
    var membership_teks = data_keranjang.data_ongkir.membership ? `
      <p class='text-success fw-semibold mt-3 ukuran_teks_detail'>Level Membership : ${data_keranjang.data_ongkir.membership.nama_membership}</p><span class="ukuran_teks_detail">${data_keranjang.data_ongkir.membership.teks_membership}</span>` : "";

    if(data_keranjang.data_ongkir.biaya_tambahan){
      membership_teks += `<p class='text-success fw-semibold mt-3 mb-0 ukuran_teks_detail'>Biaya Tambahan Ongkir</p><div class="ukuran_teks_detail mb-2 text-warning-emphasis">${data_keranjang.data_ongkir.biaya_tambahan.nama_biaya} : ${formatRupiah(data_keranjang.data_ongkir.biaya_tambahan.jumlah_biaya)}</div>`;
    }

    data_keranjang.list_data_produk.forEach((data_produk, index) => {
      html_keranjang += setDataProduk(data_produk, index);
    });
    html_keranjang += `</div></div>`;

    if(data_keranjang.data_ongkir.id_select_ongkir != "digital"){
      html_keranjang += `
      <div class="card-footer text-body-secondary">
        <i class="bi bi-truck mr-2"></i>
        <label class="ukuran_teks_detail"> Pilih Ongkos Kirim</label>
        <a href="${data_keranjang.url_pilih_ongkir}" class="link-underline link-underline-opacity-0">
          <div class="card mt-1 mb-1">
            <div class="card-body bg-active">
              <div class="d-flex">
                <span class="flex-grow-1">
                  <i class="bi bi-box-seam me-2"></i>
                  <span>${data_keranjang.data_ongkir.nama_ekspedisi || 'Ekspedisi'}</span><br>
                  <span style="font-size:10pt">${data_keranjang.data_ongkir.service || 'Reguler'} - ${formatRupiah(data_keranjang.data_ongkir.cost ? data_keranjang.data_ongkir.cost.value : 0)}</span>
                </span>
                <i class="bi bi-chevron-compact-right align-self-center" style="font-size:18pt"></i>
              </div>
            </div>
          </div>
        </a>
        ${membership_teks}
      </div>`;
    }
  }

  html_keranjang += `</div>`;
  $('#keranjang_transaksi').append(html_keranjang);
}

function setDataProduk(data_produk, idx) {
  let index = idx || 0;
  let id_item = "item_" + index;
  harga_produk_map[id_item] = data_produk.harga_barang || 0;
  qty_produk_map[id_item] = data_produk.jumlah_barang || 1;

  let html_produk = `
  <div class="col-12 mt-1 mb-2">
    <div class="row no-gutters">
      <div class="col-3 pr-3">
        <img src="${data_produk.url_gambar_barang || ''}" class="img-thumbnail mt-2" style="width:100%" onerror="this.src='https://via.placeholder.com/80?text=Produk'">
      </div>
      <div class="col-9 d-flex flex-column pl-1">
        <p class="card-title fw-bold">${data_produk.nama_barang || 'Produk MBG'}</p>
        <div class="dot_horizontal_line"></div>
        ${setDetailPembelianProduk(data_produk, id_item)}
      </div>
    </div>
    ${getTableTagihan(data_produk)}
  </div>`;
  return html_produk;
}

function setDetailPembelianProduk(data_produk, id_item) {
  let subtotal_awal = (data_produk.jumlah_barang || 1) * (data_produk.harga_barang || 0);
  let teks_detail = `
  <div class="mt-1 pt-1">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="ukuran_teks_detail font-light">Harga Satuan</span>
      <span class="ukuran_teks_detail fw-bold">${formatRupiah(data_produk.harga_barang)}</span>
    </div>
    <div class="d-flex align-items-center justify-content-between bg-light p-2 rounded border">
      <div class="d-flex align-items-center">
        <span class="ukuran_teks_detail font-light me-2">Jumlah:</span>
        <div class="input-group input-group-sm" style="width: 105px;">
          <button class="btn btn-outline-secondary" type="button" onclick="updateQtyItem('${id_item}', -1)"><i class="bi bi-dash"></i></button>
          <input type="text" class="form-control text-center fw-bold px-1" id="input_qty_${id_item}" value="${data_produk.jumlah_barang || 1}" readonly style="font-size:10pt;">
          <button class="btn btn-outline-secondary" type="button" onclick="updateQtyItem('${id_item}', 1)"><i class="bi bi-plus"></i></button>
        </div>
      </div>
      <div class="text-end ms-2">
        <span class="ukuran_teks_detail font-light d-block" style="font-size:8pt; line-height: 1.1;">Preview Harga</span>
        <span class="fw-bold text-primary" id="preview_harga_${id_item}" style="font-size:11pt;">${formatRupiah(subtotal_awal)}</span>
      </div>
    </div>
  </div>`;
  return teks_detail;
}

function updateQtyItem(id_item, delta) {
  let current_qty = qty_produk_map[id_item] || 1;
  let new_qty = current_qty + delta;
  if (new_qty < 1) new_qty = 1;
  qty_produk_map[id_item] = new_qty;
  $('#input_qty_' + id_item).val(new_qty);
  let harga_satuan = harga_produk_map[id_item] || 0;
  let subtotal_item = harga_satuan * new_qty;
  $('#preview_harga_' + id_item).text(formatRupiah(subtotal_item));
  recalcTotalBelanja();
}

function recalcTotalBelanja() {
  let total_produk = 0;
  for (let key in qty_produk_map) {
    total_produk += (qty_produk_map[key] || 1) * (harga_produk_map[key] || 0);
  }
  let total_akhir = total_produk + base_total_ongkir - base_potongan_voucher;
  if (total_akhir < 0) total_akhir = 0;
  $('#totalbayar').text(formatRupiah(total_akhir));
  $('#val_total_harga_produk').text(formatRupiah(total_produk));
}

function startPerhitungan() {
  if(json_checkout && json_checkout.perhitungan_transaksi){
    base_total_ongkir = json_checkout.perhitungan_transaksi.total_ongkir || 0;
    base_potongan_voucher = json_checkout.perhitungan_transaksi.total_potongan_voucher || 0;
    $('#totalbayar').text(formatRupiah(json_checkout.perhitungan_transaksi.total_transaksi));
    $('#ringkasan_belanja').empty();
    $('#ringkasan_belanja').append(`
      <div class="d-flex flex-row">
        <span class="ukuran_teks_detail font-light">Total Harga Produk</span>
        <span class="ukuran_teks_detail ms-auto fw-bold" id="val_total_harga_produk">${formatRupiah(json_checkout.perhitungan_transaksi.total_harga_produk)}</span>
      </div>`);
    setHTMLPerhitunganTransaksi("Total Ongkos Kirim", json_checkout.perhitungan_transaksi.total_ongkir, "");
    if(json_checkout.perhitungan_transaksi.total_potongan_voucher > 0){
      setHTMLPerhitunganTransaksi("Potongan Harga Voucher", json_checkout.perhitungan_transaksi.total_potongan_voucher, "text-danger");
    }
  }
}

function setHTMLPerhitunganTransaksi(judul, harga, textdanger) {
  $('#ringkasan_belanja').append(`
  <div class="d-flex flex-row">
    <span class="ukuran_teks_detail font-light ${textdanger}">${judul}</span>
    <span class="ukuran_teks_detail ms-auto ${textdanger}">${textdanger == 'text-danger' ? '- ' : ''}${formatRupiah(harga)}</span>
  </div>`);
}

function setMetodeBayar() {
  if(json_checkout.metode_bayar){
    if(json_checkout.metode_bayar.status=="error"){ $('#tombol_bayar').hide(); }
    $('#judul_metode_bayar').text(json_checkout.metode_bayar.judul_bayar);
    if(json_checkout.metode_bayar.url_icon){ $('#icon_metode_bayar').attr("src", json_checkout.metode_bayar.url_icon); }
  }
}

function setAlamatUser(alamat_user) {
  $('#nama_penerima').text(alamat_user.nama_penerima);
  $('#alamat_lengkap').text(alamat_user.alamat_lengkap);
  $('#lokasi_tujuan').text(alamat_user.kecamatan + ", " + alamat_user.kota);
}

function setDataDropship() {
  if(json_checkout.data_dropship && json_checkout.data_dropship.status){ $('#link-dropship').removeClass("d-none"); }
}

function showInfoVoucher() {
  if(typeof json_checkout.voucher == 'object' && json_checkout.voucher.status=="ok"){
    $("#area_voucher").html(`<div class="card text-bg-success mt-2"><div class="card-body">Voucher <b>${json_checkout.voucher.kode_voucher}</b> aktif</div></div>`);
  }
}

function buatAlert(pesan) {
  $("#pesan_alert").html(`<div class="alert alert-warning">${pesan}</div>`);
}

function getTableTagihan(data_produk) {
  // cek apakah data_produk memiliki objek "data_pascabayar"
  if(data_produk.data_pascabayar){
    // cek apakah nilai_tagihan bernilai true.
    // jika bernilai true, maka tagihan ditemukan, jika false, maka tagihan gagal dicek atau sudah dibayar
    if(data_produk.data_pascabayar.status_tagihan){
      let teks_table=`<div class="col-12 d-flex flex-column pl-1">
      <div class="mb-3 fw-semibold"><i class="bi bi-bar-chart-steps"></i> Data Tagihan Anda</div>
      <table class="table table-striped ukuran_teks_detail"><tbody>`;
      data_produk.data_pascabayar.list_data_tagihan.forEach((item, i) => {
        teks_table+=`
        <tr>
          <td class="text-capitalize">${item.nama_key.toLowerCase()}</td>
          <td>:</td>
          <td class="text-break">${item.isi_key}</td>
        </tr>`;
      });
      teks_table+=`</tbody></table></div>`;
      return teks_table;
    }else{
      // tagihan gagal di cek. transaksi tidak bisa dilanjutkan, sembunyikan tombol bayar
      $('#tombol_bayar').hide();
      return `<div class="alert alert-danger mt-3" role="alert">${data_produk.data_pascabayar.pesan}</div>`;
    }
  }
  return "";
}

function formatRupiah(angka){
  if (angka === undefined || angka === null) return "Rp0";
  angka=angka.toString();
  let is_minus=angka.charAt(0)=='-'?true:false;
  if(is_minus){
    angka=angka.substring(1);
  }
  var number_string = angka.toString().replace(/[^,\d]/g, '').toString(),
  split   		= number_string.split(','),
  sisa     		= split[0].length % 3,
  rupiah     		= split[0].substr(0, sisa),
  ribuan     		= split[0].substr(sisa).match(/\d{3}/gi);

  // tambahkan titik jika yang di input sudah menjadi angka ribuan
  if(ribuan){
    separator = sisa ? '.' : '';
    rupiah += separator + ribuan.join('.');
  }

  rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
  let minus_sign=is_minus?"-":"";
  return minus_sign+'Rp' + rupiah;
}

function renderDemoFallback() {
  $('#alamat_lengkap').text("Jl. Merdeka Raya No. 10, Jakarta Pusat");
  $('#lokasi_tujuan').text("Kota Jakarta Pusat, Gambir, DKI Jakarta");
  $('#nama_penerima').text("SPPG SMPN 1 Belanja Pagi - 081234567890");

  let demo_keranjang = {
    data_ongkir: {
      nama_ekspedisi: "JNE Express",
      service: "REG",
      cost: { value: 20000 }
    },
    url_pilih_ongkir: "{{url_website_baru}}/pilih_ongkir",
    list_data_produk: [
      {
        nama_barang: "Bola ubi (Ready Stock)",
        harga_barang: 12000,
